schemaVersion: 1

cli:
  install: npx
  versions:
    codex: 0.163.0

providers:
  deepseek:
    kind: compatible
    baseUrl: https://api.deepseek.com
    protocol: responses
    model: deepseek-v4-pro
    auth:
      mode: environment
      env: DEEPSEEK_API_KEY

triage:
  duplicateSearch: true
  maxDuplicateCandidates: 8

investigation:
  engine: codex
  provider: deepseek
  trigger: label
  triggerLabel: AI-Investigate
  mode: execute
  timeoutMinutes: 20
  maxTurns: 20
  workspace: workspace-write
  # Review exact public Issue attachments in the controller; keep the investigation Agent offline.
  approvalMode: auto-review
  network: false

evidencePolicy:
  unreproducedMaxPriority: medium
  requireObservedCommandForReproduced: true
  requireReplayForVerifiedSteps: true
  allowUnreproducedHighImpactPriority: false

mutation:
  mode: suggest
  confirmLabel: Confirm
  rerunLabel: AI-Rerun
  assignConfirmer: true
  applySuggestedTitle: false
  closeNegativeDispositions: true
  rerunOnAuthorFollowup: true
